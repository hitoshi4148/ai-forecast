<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー指定施設設定 - UI例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background-color: #F3F4F6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #1E40AF;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .settings-card {
            background-color: #FFFFFF;
            border: 2px solid #1E40AF;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .settings-header {
            color: #1E40AF;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
            margin-bottom: 8px;
        }

        .required {
            color: #EF4444;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 2px solid #D1D5DB;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #1E40AF;
        }

        .location-button {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #FFFFFF;
            background-color: #1E40AF;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .location-button:hover:not(:disabled) {
            background-color: #1E3A8A;
        }

        .location-button:disabled {
            background-color: #9CA3AF;
            cursor: not-allowed;
        }

        .manual-input-section {
            background-color: #F9FAFB;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid #E5E7EB;
        }

        .manual-input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .manual-input-label {
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        .coordinates-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .coordinate-input {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 2px solid #D1D5DB;
            border-radius: 6px;
            outline: none;
        }

        .coordinate-input:focus {
            border-color: #1E40AF;
        }

        .coordinate-label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #6B7280;
            margin-bottom: 4px;
        }

        .help-text {
            margin-top: 8px;
            font-size: 11px;
            color: #6B7280;
            line-height: 1.5;
        }

        .error-message {
            background-color: #FEF2F2;
            border: 1px solid #FCA5A5;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .error-text {
            color: #DC2626;
            font-size: 14px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .current-settings {
            background-color: #EFF6FF;
            border: 1px solid #93C5FD;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .current-settings-title {
            font-size: 12px;
            color: #1E40AF;
            margin: 0;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .current-settings-item {
            font-size: 12px;
            color: #1E40AF;
            margin: 4px 0;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-save {
            background-color: #10B981;
        }

        .btn-save:hover:not(:disabled) {
            background-color: #059669;
        }

        .btn-save:disabled {
            background-color: #9CA3AF;
            cursor: not-allowed;
        }

        .btn-clear {
            background-color: #EF4444;
        }

        .btn-clear:hover {
            background-color: #DC2626;
        }

        .link-button {
            font-size: 12px;
            color: #1E40AF;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
        }

        .status-message {
            margin-top: 8px;
            font-size: 12px;
            color: #6B7280;
            text-align: center;
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ユーザー指定施設設定</h1>

        <div class="settings-card">
            <h2 class="settings-header">
                <span>📍</span>
                <span>ユーザー指定施設の設定</span>
            </h2>

            <!-- 施設名入力 -->
            <div class="form-group">
                <label class="form-label">
                    施設名 <span class="required">*</span>
                </label>
                <input
                    type="text"
                    id="facilityName"
                    class="form-input"
                    placeholder="例: 〇〇ゴルフクラブ"
                />
            </div>

            <!-- 位置情報取得ボタン -->
            <div id="locationButtonSection" class="form-group">
                <button
                    id="locationButton"
                    class="location-button"
                    onclick="getCurrentLocation()"
                >
                    <span>📍</span>
                    <span>現在地から位置情報を取得</span>
                </button>
                <p id="locationStatus" class="status-message" style="display: none;"></p>
            </div>

            <!-- 手動入力フォーム -->
            <div id="manualInputSection" class="manual-input-section" style="display: none;">
                <div class="manual-input-header">
                    <label class="manual-input-label">手動入力</label>
                </div>

                <div class="coordinates-grid">
                    <div>
                        <label class="coordinate-label">
                            緯度（Latitude） <span class="required">*</span>
                        </label>
                        <input
                            type="number"
                            id="latitude"
                            class="coordinate-input"
                            placeholder="例: 35.6812"
                            step="any"
                        />
                    </div>

                    <div>
                        <label class="coordinate-label">
                            経度（Longitude） <span class="required">*</span>
                        </label>
                        <input
                            type="number"
                            id="longitude"
                            class="coordinate-input"
                            placeholder="例: 139.7671"
                            step="any"
                        />
                    </div>
                </div>

                <p class="help-text">
                    💡 緯度・経度はGoogleマップなどで確認できます。<br>
                    地図上で右クリック → 「座標をコピー」で取得できます。
                </p>
            </div>

            <!-- 手動入力切り替えボタン -->
            <div id="manualInputToggle" style="display: none; margin-bottom: 16px; text-align: center;">
                <button class="link-button" onclick="showManualInput()">
                    手動で緯度・経度を入力する
                </button>
            </div>

            <!-- エラーメッセージ -->
            <div id="errorMessage" class="error-message" style="display: none;">
                <p class="error-text">
                    <span>⚠️</span>
                    <span id="errorText"></span>
                </p>
            </div>

            <!-- 現在の設定値表示 -->
            <div id="currentSettings" class="current-settings" style="display: none;">
                <p class="current-settings-title">現在の設定:</p>
                <p id="currentName" class="current-settings-item"></p>
                <p id="currentCoordinates" class="current-settings-item"></p>
            </div>

            <!-- アクションボタン -->
            <div class="action-buttons">
                <button
                    id="saveButton"
                    class="btn btn-save"
                    onclick="handleSave()"
                    disabled
                >
                    💾 保存
                </button>

                <button
                    class="btn btn-clear"
                    onclick="handleClear()"
                >
                    🗑️ クリア
                </button>
            </div>
        </div>

        <!-- 保存された施設情報の表示例 -->
        <div class="settings-card">
            <h2 class="settings-header">
                <span>📋</span>
                <span>保存された施設情報</span>
            </h2>
            <div id="savedFacilityInfo" style="color: #6B7280; font-size: 14px;">
                まだ保存されていません
            </div>
        </div>
    </div>

    <script>
        // Cookie操作関数
        function getCookie(name) {
            const cookies = document.cookie.split(';');
            const cookie = cookies.find(c => c.trim().startsWith(name + '='));
            if (cookie) {
                return decodeURIComponent(cookie.split('=')[1]);
            }
            return null;
        }

        function setCookie(name, value, days) {
            const expires = new Date();
            expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
            document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires.toUTCString()}; path=/`;
        }

        function deleteCookie(name) {
            document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
        }

        // 施設情報の取得・保存
        function getFacilityFromCookie() {
            const jsonStr = getCookie('userFacility');
            if (jsonStr) {
                try {
                    return JSON.parse(jsonStr);
                } catch (e) {
                    console.error('Cookie解析エラー:', e);
                    return null;
                }
            }
            return null;
        }

        function saveFacilityToCookie(facility) {
            setCookie('userFacility', JSON.stringify(facility), 365);
        }

        // 位置情報取得
        function getCurrentLocation() {
            const button = document.getElementById('locationButton');
            const status = document.getElementById('locationStatus');
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            button.disabled = true;
            button.innerHTML = '<span class="spinner">⏳</span><span>位置情報を取得中...</span>';
            errorDiv.style.display = 'none';

            if (!navigator.geolocation) {
                showError('お使いのブラウザは位置情報APIをサポートしていません。手動で入力してください。');
                showManualInput();
                button.disabled = false;
                button.innerHTML = '<span>📍</span><span>現在地から位置情報を取得</span>';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    document.getElementById('latitude').value = lat.toFixed(6);
                    document.getElementById('longitude').value = lng.toFixed(6);
                    
                    status.style.display = 'block';
                    status.textContent = '位置情報を取得しました。';
                    status.style.color = '#10B981';

                    button.disabled = false;
                    button.innerHTML = '<span>📍</span><span>現在地から位置情報を取得</span>';

                    updateCurrentSettings();
                    updateSaveButton();
                },
                (error) => {
                    console.error('位置情報取得エラー:', error);
                    showManualInput();
                    button.disabled = false;
                    button.innerHTML = '<span>📍</span><span>現在地から位置情報を取得</span>';

                    let errorMsg = '';
                    switch (error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = '位置情報の取得が拒否されました。手動で緯度・経度を入力してください。';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = '位置情報が取得できませんでした。手動で緯度・経度を入力してください。';
                            break;
                        case error.TIMEOUT:
                            errorMsg = '位置情報の取得がタイムアウトしました。手動で緯度・経度を入力してください。';
                            break;
                        default:
                            errorMsg = '位置情報の取得に失敗しました。手動で緯度・経度を入力してください。';
                    }
                    showError(errorMsg);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // 手動入力フォームを表示
        function showManualInput() {
            document.getElementById('manualInputSection').style.display = 'block';
            document.getElementById('manualInputToggle').style.display = 'none';
        }

        // エラー表示
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.style.display = 'block';
        }

        // 現在の設定値を更新
        function updateCurrentSettings() {
            const name = document.getElementById('facilityName').value;
            const lat = document.getElementById('latitude').value;
            const lng = document.getElementById('longitude').value;

            if (lat || lng) {
                const currentDiv = document.getElementById('currentSettings');
                const currentName = document.getElementById('currentName');
                const currentCoords = document.getElementById('currentCoordinates');

                currentDiv.style.display = 'block';
                if (name) {
                    currentName.textContent = `施設名: ${name}`;
                }
                if (lat && lng) {
                    currentCoords.textContent = `座標: ${lat}, ${lng}`;
                }
            }
        }

        // 保存ボタンの有効/無効を更新
        function updateSaveButton() {
            const name = document.getElementById('facilityName').value;
            const lat = document.getElementById('latitude').value;
            const lng = document.getElementById('longitude').value;
            const saveButton = document.getElementById('saveButton');

            saveButton.disabled = !(name.trim() && lat && lng);
        }

        // 保存処理
        function handleSave() {
            const name = document.getElementById('facilityName').value.trim();
            const lat = document.getElementById('latitude').value;
            const lng = document.getElementById('longitude').value;

            // バリデーション
            if (!name) {
                showError('施設名を入力してください。');
                return;
            }

            if (!lat || !lng) {
                showError('緯度・経度を入力するか、位置情報を取得してください。');
                return;
            }

            const latNum = parseFloat(lat);
            const lngNum = parseFloat(lng);

            if (isNaN(latNum) || isNaN(lngNum)) {
                showError('緯度・経度は数値で入力してください。');
                return;
            }

            if (latNum < -90 || latNum > 90) {
                showError('緯度は-90から90の範囲で入力してください。');
                return;
            }

            if (lngNum < -180 || lngNum > 180) {
                showError('経度は-180から180の範囲で入力してください。');
                return;
            }

            const facility = {
                name: name,
                latitude: latNum,
                longitude: lngNum
            };

            saveFacilityToCookie(facility);
            document.getElementById('errorMessage').style.display = 'none';
            
            // 保存された情報を表示
            updateSavedFacilityInfo(facility);
            
            alert('施設情報を保存しました。');
        }

        // クリア処理
        function handleClear() {
            document.getElementById('facilityName').value = '';
            document.getElementById('latitude').value = '';
            document.getElementById('longitude').value = '';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('currentSettings').style.display = 'none';
            document.getElementById('manualInputSection').style.display = 'none';
            document.getElementById('manualInputToggle').style.display = 'none';
            document.getElementById('locationStatus').style.display = 'none';
            
            deleteCookie('userFacility');
            updateSavedFacilityInfo(null);
            updateSaveButton();
        }

        // 保存された施設情報を表示
        function updateSavedFacilityInfo(facility) {
            const infoDiv = document.getElementById('savedFacilityInfo');
            if (facility) {
                infoDiv.innerHTML = `
                    <div style="margin-bottom: 8px;">
                        <strong>施設名:</strong> ${facility.name}
                    </div>
                    <div>
                        <strong>座標:</strong> ${facility.latitude}, ${facility.longitude}
                    </div>
                `;
            } else {
                infoDiv.textContent = 'まだ保存されていません';
            }
        }

        // イベントリスナー設定
        document.getElementById('facilityName').addEventListener('input', () => {
            updateCurrentSettings();
            updateSaveButton();
        });

        document.getElementById('latitude').addEventListener('input', () => {
            updateCurrentSettings();
            updateSaveButton();
        });

        document.getElementById('longitude').addEventListener('input', () => {
            updateCurrentSettings();
            updateSaveButton();
        });

        // ページ読み込み時にCookieから復元
        window.addEventListener('DOMContentLoaded', () => {
            const savedFacility = getFacilityFromCookie();
            if (savedFacility) {
                document.getElementById('facilityName').value = savedFacility.name;
                document.getElementById('latitude').value = savedFacility.latitude;
                document.getElementById('longitude').value = savedFacility.longitude;
                updateCurrentSettings();
                updateSaveButton();
                updateSavedFacilityInfo(savedFacility);
            }
        });
    </script>
</body>
</html>
