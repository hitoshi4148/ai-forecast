services:
  - type: web
    name: turf-disease-forecast
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # MET_NORWAY_USER_AGENT は未設定時、lib/met-norway-api.js のメール連絡先デフォルトを使用。
      # example.com 等のプレースホルダを入れると MET Norway が 403 を返すことがあります。
